[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "top10-movies"
version = "0.1.0"
description = "Unattended CPU movie countdown production"
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests>=2.32,<3", "Pillow>=11,<12", "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<4.12", "faster-whisper>=1.2,<2",
  "yt-dlp[default]>=2026.1.1", "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
thumbnails = ["rembg[cpu]==2.0.67"]
voice = ["chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2"]
test = ["pytest>=8,<9", "PyYAML>=6,<7"]

[project.scripts]
movie-pipeline = "movie_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["movie_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
