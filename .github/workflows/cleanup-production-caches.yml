name: Expire Production Caches

on:
  schedule:
    # Hourly, off the busy start of the hour. GitHub schedules can run late.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete only expired video-production checkpoint caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.expire_production_caches
