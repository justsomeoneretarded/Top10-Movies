name: Reference quality focused checks
on:
  push:
    branches: [feature/reference-quality-focused-checks]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash scripts/install_system_packages.sh ffmpeg fonts-dejavu-core
      - run: python -m pip install -e '.[test]'
      - name: Run reference, editorial, audio, scene, report and graph tests
        run: pytest -q tests/test_reference_analysis.py tests/test_script.py tests/test_natural_narration.py tests/test_voice.py tests/test_scenes.py tests/test_review.py tests/test_graphify_trial.py
