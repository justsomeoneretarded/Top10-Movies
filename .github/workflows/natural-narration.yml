name: Natural narration review
on:
  push:
    branches: [fix/natural-editorial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: bash scripts/install_system_packages.sh ffmpeg fonts-dejavu-core
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q movie_pipeline scripts
      - run: pytest -q tests/test_natural_narration.py tests/test_script.py tests/test_story.py tests/test_cta.py tests/test_voice.py tests/test_voice_boundaries.py tests/test_timing.py tests/test_workflow.py tests/test_warm_stages.py tests/test_production.py tests/test_movie_ranks_upgrade.py
      - name: Check workflow syntax
        run: |
          curl -fLsS --retry 2 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Render reaction contact sheet
        if: ${{ !cancelled() }}
        run: python -m scripts.natural_preview --reactions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reaction-quality-preview
          path: natural-review/
          retention-days: 2
  writing:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[script-audit]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SCRIPT_MODEL: gemma4:12b
      OLLAMA_HOST: 127.0.0.1:11435
      OLLAMA_URL: http://127.0.0.1:11435
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MODELS: ${{ github.workspace }}/work/ollama-models
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m scripts.runner_disk --stage script
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: bash scripts/install_system_packages.sh ffmpeg zstd
      - run: python -m pip install -e '.[test]'
      - run: bash scripts/bootstrap_ollama.sh
      - name: Generate and edit real-model samples
        run: python -m scripts.natural_preview --writing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-script-samples
          path: natural-review/
          retention-days: 2

  voice:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[voice-audit]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SCRIPT_MODEL: gemma4:12b
      TTS_MODEL: turbo
      HF_HOME: ${{ github.workspace }}/work/models/huggingface
      TORCH_HOME: ${{ github.workspace }}/work/models/torch
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m scripts.runner_disk --stage voice-warm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: bash scripts/install_system_packages.sh ffmpeg
      - run: python -m pip install -e '.[test]'
      - uses: actions/cache/restore@v4
        with:
          path: work/models
          key: models-cpu-v3-thumbnails-${{ runner.os }}-${{ env.TTS_MODEL }}-${{ env.SCRIPT_MODEL }}
          restore-keys: models-cpu-v2-${{ runner.os }}-${{ env.TTS_MODEL }}-${{ env.SCRIPT_MODEL }}
      - run: python3 -m scripts.runner_disk --stage voice-warm
      - run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[voice]'
      - name: Generate matched dry, processed and paced narration
        run: python -m scripts.natural_voice_preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-voice-samples
          path: natural-voice-review/
          retention-days: 2
