name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test media dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: python -m pip install -e '.[test]'
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -q -rfE --tb=short -p no:cacheprovider 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface failures as annotations so they are readable without log access.
            grep -E "^(FAILED|ERROR) " pytest.log | head -40 | while IFS= read -r line; do
              echo "::error title=Test failure::${line//$'\r'/}"
            done
            grep -E "^E  " pytest.log | head -60 | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Assertion details::/'
            echo
          fi
          exit "$status"
