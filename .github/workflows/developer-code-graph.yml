name: Developer code graph
on:
  workflow_dispatch:
  push:
    branches: [feature/graphify-trial]
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated developer tools
        run: python -m pip install 'graphifyy==0.9.102' 'pytest>=8,<9'
      - name: Check corpus isolation
        run: python -m pytest -q tests/test_graphify_trial.py
      - name: Extract graph and query two pipeline relationships
        env:
          GRAPHIFY_BACKEND: none
          GRAPHIFY_QUERY_LOG_DISABLE: "1"
        run: python -m scripts.graphify_trial --out "$RUNNER_TEMP/movie-ranks-code-graph"
      - name: Save graph and query evidence
        uses: actions/upload-artifact@v4
        with:
          name: movie-ranks-code-graph
          path: ${{ runner.temp }}/movie-ranks-code-graph/
          retention-days: 2
          if-no-files-found: error
