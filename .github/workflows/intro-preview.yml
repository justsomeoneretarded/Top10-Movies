name: Intro and rank preview
on:
  push:
    branches: [fix/premium-rank-intros]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intro-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIDEO_RESOLUTION: 1280x720
      VIDEO_GENRE: neutral
      TRANSITION_FX: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: bash scripts/install_system_packages.sh ffmpeg fonts-dejavu-core espeak-ng
      - run: python -m pip install -e '.[test]'
      - name: Compile and test introduction timing
        run: |
          python -m compileall -q movie_pipeline scripts
          pytest -q tests/test_rank_intro.py tests/test_branding_motion.py tests/test_production.py tests/test_warm_stages.py tests/test_sound_design.py tests/test_movie_ranks_upgrade.py tests/test_render.py tests/test_subtitles.py
      - name: Render and inspect real FFmpeg branding and rank sequence
        if: ${{ !cancelled() }}
        run: |
          python -m scripts.branding_preview --output-dir intro-preview
          python -m scripts.rank_intro_preview --output-dir intro-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intro-and-rank-preview
          path: intro-preview/
          retention-days: 2
